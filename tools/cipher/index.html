<!DOCTYPE html>
<html lang="zh-cn" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
  <title>Pixel Cipher</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect rx='18' width='100' height='100' fill='%232563eb'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='56' font-family='system-ui' font-weight='bold' fill='white'%3EES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 主题切换 -->
<button class="theme-toggle" id="themeToggle" aria-label="切换主题">
  <span class="toggle-icon sun">☀️</span>
  <span class="toggle-icon moon">🌙</span>
</button>

<div class="tool-card">
  <!-- 标题 -->
  <div class="card-header">
    <h1 class="card-title">Pixel Cipher</h1>
    <p class="card-desc">图片与视频像素级加密工具</p>
  </div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <button class="btn btn-outline" id="importBtn">
      <span class="btn-emoji">📂</span>
      <span class="btn-label">导入</span>
    </button>
    <button class="btn btn-accent" id="encryptBtn" disabled>
      <span class="btn-emoji">🔒</span>
      <span class="btn-label">加密</span>
    </button>
    <button class="btn btn-accent" id="decryptBtn" disabled>
      <span class="btn-emoji">🔓</span>
      <span class="btn-label">解密</span>
    </button>
    <button class="btn btn-outline" id="exportBtn" disabled>
      <span class="btn-emoji">💾</span>
      <span class="btn-label">导出</span>
    </button>
  </div>

  <!-- 进度条 -->
  <div class="progress-section" id="progressSection">
    <progress id="progressBar" value="0" max="100"></progress>
    <span id="progressText">0%</span>
  </div>

  <!-- 文件信息 -->
  <div class="file-info" id="fileInfo">📋 未导入文件</div>

  <!-- 预览区域 -->
  <div class="preview-area" id="previewArea">
    <div class="preview-empty" id="previewEmpty">
      <div class="empty-icon">🖼️</div>
      <p class="empty-title">拖拽文件到此处</p>
      <p class="empty-sub">或点击「📂 导入」按钮 · 支持图片和视频</p>
    </div>
    <img id="previewImg" class="preview-media" alt="预览">
    <canvas id="previewCanvas" class="preview-media"></canvas>
    <!-- 视频播放进度 -->
    <div class="video-progress-bar" id="videoProgressBar" style="display:none;">
      <div class="video-progress-fill" id="videoProgressFill"></div>
    </div>
    <!-- 加载指示 -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <span class="loading-text">处理中…</span>
    </div>
  </div>

  <!-- 导航行 -->
  <div class="nav-row" id="navRow" style="display:none;">
    <button class="btn btn-ghost btn-small" id="prevBtn">⬅ 上一张</button>
    <span class="nav-counter" id="navCounter">1 / 1</span>
    <button class="btn btn-ghost btn-small" id="nextBtn">下一张 ➡</button>
    <button class="btn btn-danger btn-small" id="restoreBtn">🔄 还原</button>
  </div>
</div>

<!-- 加密参数弹窗 -->
<div id="encryptModal" class="modal-overlay">
  <div class="param-window">
    <h3>🔒 加密参数</h3>
    <div class="param-row">
      <label>加密方式</label>
      <div class="radio-group">
        <label><input type="radio" name="encMode" value="gilbert" checked> 🌀 吉尔伯特曲线</label>
        <label><input type="radio" name="encMode" value="block"> 🧱 块打乱</label>
      </div>
    </div>
    <div class="param-row">
      <label>🔑 密钥（可选）</label>
      <input type="text" id="encKeyInput" placeholder="留空表示无密钥">
    </div>
    <div class="param-row block-params" id="encBlockParams" style="display:none;">
      <label>块宽度（像素）</label>
      <input type="number" id="encBlockW" value="16" min="1" max="512">
    </div>
    <div class="param-row block-params" id="encBlockParamsH" style="display:none;">
      <label>块高度（像素）</label>
      <input type="number" id="encBlockH" value="16" min="1" max="512">
    </div>
    <div class="modal-buttons">
      <button class="btn btn-accent flex-1" id="encConfirmBtn">✅ 确定</button>
      <button class="btn btn-ghost flex-1 modal-cancel" data-close="encryptModal">❌ 取消</button>
    </div>
  </div>
</div>

<!-- 解密参数弹窗 -->
<div id="decryptModal" class="modal-overlay">
  <div class="param-window">
    <h3>🔓 解密参数</h3>
    <div class="param-row">
      <label>解密方式</label>
      <div class="radio-group">
        <label><input type="radio" name="decMode" value="gilbert" checked> 🌀 吉尔伯特曲线</label>
        <label><input type="radio" name="decMode" value="block"> 🧱 块打乱</label>
      </div>
    </div>
    <div class="param-row">
      <label>🔑 密钥（可选）</label>
      <input type="text" id="decKeyInput" placeholder="留空表示无密钥">
    </div>
    <div class="param-row block-params" id="decBlockParams" style="display:none;">
      <label>块宽度（像素）</label>
      <input type="number" id="decBlockW" value="16" min="1" max="512">
    </div>
    <div class="param-row block-params" id="decBlockParamsH" style="display:none;">
      <label>块高度（像素）</label>
      <input type="number" id="decBlockH" value="16" min="1" max="512">
    </div>
    <div class="modal-buttons">
      <button class="btn btn-accent flex-1" id="decConfirmBtn">✅ 确定</button>
      <button class="btn btn-ghost flex-1 modal-cancel" data-close="decryptModal">❌ 取消</button>
    </div>
  </div>
</div>

<!-- 导出弹窗 -->
<div id="exportModal" class="modal-overlay">
  <div class="param-window">
    <h3>💾 导出设置</h3>
    <div class="param-row">
      <label>导出格式</label>
      <div class="export-format-row" id="exportFormatRow">
        <select id="exportFormat">
          <option value="jpg">📷 JPG（95% 质量）</option>
          <option value="png" selected>🖼️ PNG（无损）</option>
          <option value="webp">🌐 WebP（无损）</option>
        </select>
      </div>
    </div>
    <div class="param-row" id="exportVideoNote" style="display:none;">
      <p class="hint-text">🎬 视频将导出为 WebM 格式</p>
    </div>
    <div class="modal-buttons">
      <button class="btn btn-accent flex-1" id="exportConfirmBtn">✅ 确定</button>
      <button class="btn btn-ghost flex-1 modal-cancel" data-close="exportModal">❌ 取消</button>
    </div>
  </div>
</div>

<!-- 图片放大预览 -->
<div id="lightbox" class="lightbox-overlay">
  <img id="lightboxImg" class="lightbox-img" alt="">
</div>

<!-- 隐藏元素 -->
<input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none;">
<video id="hiddenVideo" preload="auto" playsinline style="display:none;"></video>

<script type="module" src="app.js"></script>
</body>
</html>
