<!DOCTYPE html>
<html lang="zh-cn" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
  <title>加密解密工具</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 主题切换 -->
<button class="theme-toggle" id="themeToggle" aria-label="切换主题">
  <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-4a1 1 0 011 1v1a1 1 0 11-2 0V4a1 1 0 011-1zm0 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm8-8a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM6 12a1 1 0 01-1 1H4a1 1 0 110-2h1a1 1 0 011 1zm12.36-5.64a1 1 0 010 1.41l-.7.71a1 1 0 11-1.42-1.42l.71-.7a1 1 0 011.41 0zM7.76 16.24a1 1 0 010 1.41l-.71.71a1 1 0 01-1.41-1.42l.7-.7a1 1 0 011.42 0zm10.48 0a1 1 0 011.41 0l.71.7a1 1 0 11-1.42 1.42l-.7-.71a1 1 0 010-1.41zM7.76 7.76a1 1 0 01-1.41 0l-.71-.7a1 1 0 011.42-1.42l.7.71a1 1 0 010 1.41z"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12.1 22c-5.5 0-10-4.5-10-10 0-4.8 3.4-8.8 8.1-9.8.4-.1.8 0 1.1.3.3.3.3.7.2 1.1-.5 1.2-.8 2.5-.8 3.9 0 5 4.1 9 9 9 .8 0 1.5-.1 2.2-.3.4-.1.8 0 1.1.3.3.3.3.7.2 1.1-1.3 2.8-4 4.4-7.1 4.4z"/></svg>
</button>

<div class="tool-card">
  <!-- 工具栏 -->
  <div class="toolbar">
    <button class="btn" id="importBtn">导入</button>
    <button class="btn btn-primary" id="encryptBtn" disabled>全部加密</button>
    <button class="btn btn-primary" id="decryptBtn" disabled>解密</button>
    <button class="btn" id="exportBtn" disabled>导出</button>
  </div>

  <!-- 进度条 -->
  <div class="progress-section" id="progressSection">
    <progress id="progressBar" value="0" max="100"></progress>
    <span id="progressText">0%</span>
  </div>

  <!-- 文件信息 -->
  <div class="file-info" id="fileInfo">未导入文件</div>

  <!-- 预览区域 -->
  <div class="preview-area" id="previewArea">
    <div class="preview-empty" id="previewEmpty">
      <p>拖拽文件到此处，或点击「导入」按钮</p>
      <p>支持图片和视频</p>
    </div>
    <img id="previewImg" class="preview-media" alt="预览">
    <canvas id="previewCanvas" class="preview-media"></canvas>
    <!-- 视频播放进度 -->
    <div class="video-progress-bar" id="videoProgressBar" style="display:none;">
      <div class="video-progress-fill" id="videoProgressFill"></div>
    </div>
    <!-- 加载指示 -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- 导航行 -->
  <div class="nav-row" id="navRow" style="display:none;">
    <button class="btn btn-small" id="prevBtn">&larr; 上一张</button>
    <span class="nav-counter" id="navCounter">1 / 1</span>
    <button class="btn btn-small" id="nextBtn">下一张 &rarr;</button>
    <button class="btn btn-danger btn-small" id="restoreBtn">还原</button>
  </div>
</div>

<!-- 加密参数弹窗 -->
<div id="encryptModal" class="modal-overlay">
  <div class="param-window">
    <h3>加密参数</h3>
    <div class="param-row">
      <label>加密方式</label>
      <div class="radio-group">
        <label><input type="radio" name="encMode" value="gilbert" checked> 吉尔伯特曲线</label>
        <label><input type="radio" name="encMode" value="block"> 块打乱</label>
      </div>
    </div>
    <div class="param-row">
      <label>密钥（可选）</label>
      <input type="text" id="encKeyInput" placeholder="留空表示无密钥">
    </div>
    <div class="param-row block-params" id="encBlockParams" style="display:none;">
      <label>块宽度（像素）</label>
      <input type="number" id="encBlockW" value="16" min="1" max="512">
    </div>
    <div class="param-row block-params" id="encBlockParamsH" style="display:none;">
      <label>块高度（像素）</label>
      <input type="number" id="encBlockH" value="16" min="1" max="512">
    </div>
    <div class="modal-buttons">
      <button class="btn btn-primary" id="encConfirmBtn">确定</button>
      <button class="btn modal-cancel" data-close="encryptModal">取消</button>
    </div>
  </div>
</div>

<!-- 解密参数弹窗 -->
<div id="decryptModal" class="modal-overlay">
  <div class="param-window">
    <h3>解密参数</h3>
    <div class="param-row">
      <label>解密方式</label>
      <div class="radio-group">
        <label><input type="radio" name="decMode" value="gilbert" checked> 吉尔伯特曲线</label>
        <label><input type="radio" name="decMode" value="block"> 块打乱</label>
      </div>
    </div>
    <div class="param-row">
      <label>密钥（可选）</label>
      <input type="text" id="decKeyInput" placeholder="留空表示无密钥">
    </div>
    <div class="param-row block-params" id="decBlockParams" style="display:none;">
      <label>块宽度（像素）</label>
      <input type="number" id="decBlockW" value="16" min="1" max="512">
    </div>
    <div class="param-row block-params" id="decBlockParamsH" style="display:none;">
      <label>块高度（像素）</label>
      <input type="number" id="decBlockH" value="16" min="1" max="512">
    </div>
    <div class="modal-buttons">
      <button class="btn btn-primary" id="decConfirmBtn">确定</button>
      <button class="btn modal-cancel" data-close="decryptModal">取消</button>
    </div>
  </div>
</div>

<!-- 导出弹窗 -->
<div id="exportModal" class="modal-overlay">
  <div class="param-window">
    <h3>导出设置</h3>
    <div class="param-row">
      <label>导出格式</label>
      <div class="export-format-row" id="exportFormatRow">
        <select id="exportFormat">
          <option value="jpg">JPG（95% 质量）</option>
          <option value="png" selected>PNG（无损）</option>
          <option value="webp">WebP（无损）</option>
        </select>
      </div>
    </div>
    <div class="param-row" id="exportVideoNote" style="display:none;">
      <p style="color: var(--text-muted); font-size: 0.9rem;">视频将导出为 WebM 格式</p>
    </div>
    <div class="modal-buttons">
      <button class="btn btn-primary" id="exportConfirmBtn">确定</button>
      <button class="btn modal-cancel" data-close="exportModal">取消</button>
    </div>
  </div>
</div>

<!-- 隐藏元素 -->
<input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none;">
<video id="hiddenVideo" preload="auto" playsinline style="display:none;"></video>

<script type="module" src="app.js"></script>
</body>
</html>
