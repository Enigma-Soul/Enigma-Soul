<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random GitHub Repo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="particles"></canvas>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>

    <div class="container">
        <div class="dice-wrap">
            <div class="dice" id="dice">
                <!-- Face 5: front -->
                <div class="dice-face f-front face-5">
                    <span class="dot"></span><span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span><span class="dot"></span>
                </div>
                <!-- Face 6: back -->
                <div class="dice-face f-back face-6">
                    <span class="dot"></span><span class="dot"></span>
                    <span class="dot"></span><span class="dot"></span>
                    <span class="dot"></span><span class="dot"></span>
                </div>
                <!-- Face 1: right -->
                <div class="dice-face f-right face-1">
                    <span class="dot"></span>
                </div>
                <!-- Face 2: left -->
                <div class="dice-face f-left face-2">
                    <span class="dot"></span><span class="dot"></span>
                </div>
                <!-- Face 3: top -->
                <div class="dice-face f-top face-3">
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                </div>
                <!-- Face 4: bottom -->
                <div class="dice-face f-bottom face-4">
                    <span class="dot"></span><span class="dot"></span>
                    <span class="dot"></span><span class="dot"></span>
                </div>
            </div>
        </div>

        <h1 class="title">Random Repo</h1>
        <p class="subtitle">Discover a popular open-source repository. Roll the dice and see where luck takes you.</p>

        <div class="status" id="status">
            <span class="spinner"></span>
            <span class="status-text">Discovering...</span>
        </div>

        <button class="btn" id="redirectBtn">Roll the Dice</button>

        <div class="hint">from <a href="https://github.com/Enigma-Soul">Enigma-Soul</a></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
