<svg xmlns="http://www.w3.org/2000/svg" width="380" height="80" viewBox="0 0 380 80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#238636"/>
      <stop offset="50%" style="stop-color:#15A305"/>
      <stop offset="100%" style="stop-color:#238636"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="380" height="80" rx="12" fill="#0d1117"/>
  <rect width="380" height="80" rx="12" fill="url(#bg)" opacity="0.15"/>
  <rect x="1" y="1" width="378" height="78" rx="11" fill="none" stroke="url(#bg)" stroke-width="1.5" opacity="0.6"/>

  <!-- Dice icon -->
  <g transform="translate(22, 18)" filter="url(#glow)">
    <rect width="44" height="44" rx="8" fill="#238636" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" values="0 22 22;3 22 22;0 22 22;-3 22 22;0 22 22" dur="2s" repeatCount="indefinite"/>
    </rect>
    <!-- Dot 1 (top-left) -->
    <circle cx="13" cy="13" r="3.5" fill="#fff">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <!-- Dot 2 (top-right) -->
    <circle cx="31" cy="13" r="3.5" fill="#fff">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <!-- Dot 3 (center) -->
    <circle cx="22" cy="22" r="3.5" fill="#fff">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <!-- Dot 4 (bottom-left) -->
    <circle cx="13" cy="31" r="3.5" fill="#fff">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <!-- Dot 5 (bottom-right) -->
    <circle cx="31" cy="31" r="3.5" fill="#fff">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Text -->
  <text x="86" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#e6edf3">
    Random Repo
  </text>
  <text x="86" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e">
    Click to discover a popular repository!
  </text>

  <!-- Arrow icon -->
  <g transform="translate(340, 28)" fill="#8b949e">
    <path d="M0 12 L10 12 M6 6 L12 12 L6 18" stroke="#8b949e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
