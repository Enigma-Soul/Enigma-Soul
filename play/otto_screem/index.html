<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='54' text-anchor='middle' dominant-baseline='central' font-size='80'%3E%E2%99%BF%3C/text%3E%3C/svg%3E">
<title>棍之地狱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0e0e0e;
    overscroll-behavior: none;
  }
  /* 承载四方连续背景的视口,background-size / position 由 JS 控制 */
  #scene {
    position: fixed;
    inset: 0;
    background-image: url('otto.png');
    background-repeat: repeat;
    touch-action: none;   /* 完全由 JS 接管手势,禁用系统滚动/缩放 */
    cursor: grab;
  }
  #scene.dragging { cursor: grabbing; }

  /* 左下角控制条 */
  .hud {
    position: fixed;
    left: 14px;
    bottom: 14px;
    z-index: 10;
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px;
    border-radius: 12px;
    background: rgba(20, 20, 20, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #eee;
    user-select: none;
    -webkit-user-select: none;
  }
  .hud button {
    min-width: 38px;
    height: 38px;
    padding: 0 10px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    color: #eee;
    font-size: 18px;
    cursor: pointer;
    transition: background .15s;
  }
  .hud button:active { background: rgba(255, 255, 255, 0.2); }
  .hud .zoom-label {
    min-width: 56px;
    text-align: center;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    opacity: .85;
  }
</style>
</head>
<body>
<div id="scene"></div>

<!-- 左下角缩放控制组件(暂时隐藏)
<div class="hud">
  <button id="zoomOut" aria-label="缩小">−</button>
  <span class="zoom-label" id="zoomLabel">300%</span>
  <button id="zoomIn" aria-label="放大">+</button>
  <button id="reset" aria-label="重置">🔄</button>
</div>
-->

<script>
(() => {
  const scene = document.getElementById('scene');
  const zoomLabel = document.getElementById('zoomLabel');

  const MIN_SCALE = 2;     // 最小 200%
  const MAX_SCALE = 6;     // 最大 600%
  const DEFAULT_SCALE = 3; // 默认 300%

  // 视图状态:scale 为缩放倍数,offX/offY 为背景偏移(px)
  const view = {
    scale: DEFAULT_SCALE,
    offX: 0,
    offY: 0,
    baseUnit: 0, // scale=1 时单个图案的宽度
    ratio: 1,    // 图案高/宽
  };

  // 预加载图片以获取原始宽高,据此设置初始平铺尺寸
  const probe = new Image();
  probe.onload = () => {
    view.ratio = probe.naturalWidth ? probe.naturalHeight / probe.naturalWidth : 1;
    setBaseUnit();
    render();
  };
  probe.onerror = () => { if (zoomLabel) zoomLabel.textContent = '图片缺失'; };
  probe.src = 'otto.png';

  const mod = (n, m) => ((n % m) + m) % m;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  const mid = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });

  // 基础单元取视口短边的 30%,使初始图案大小与屏幕适配
  const setBaseUnit = () => { view.baseUnit = Math.min(innerWidth, innerHeight) * 0.3; };

  // 把状态写入 DOM,并对 offset 取模以避免数值无限增长(平铺下取模不改变视觉效果)
  function render() {
    const tileW = view.baseUnit * view.scale;
    const tileH = tileW * view.ratio;
    view.offX = mod(view.offX, tileW);
    view.offY = mod(view.offY, tileH);
    scene.style.backgroundSize = `${tileW}px ${tileH}px`;
    scene.style.backgroundPosition = `${view.offX}px ${view.offY}px`;
    if (zoomLabel) zoomLabel.textContent = Math.round(view.scale * 100) + '%';
  }

  // 以屏幕坐标 (cx,cy) 为锚点缩放,保持该处图案纹理不动
  function zoomAt(cx, cy, factor) {
    const next = clamp(view.scale * factor, MIN_SCALE, MAX_SCALE);
    const real = next / view.scale;
    if (real === 1) return;
    view.offX = cx - real * (cx - view.offX);
    view.offY = cy - real * (cy - view.offY);
    view.scale = next;
    render();
  }

  function reset() {
    view.scale = DEFAULT_SCALE;
    view.offX = 0;
    view.offY = 0;
    render();
  }

  // ===== 鼠标:拖动平移 + 滚轮缩放 =====
  let mouseDown = false, lastX = 0, lastY = 0;
  scene.addEventListener('mousedown', e => {
    mouseDown = true; lastX = e.clientX; lastY = e.clientY;
    scene.classList.add('dragging');
  });
  window.addEventListener('mousemove', e => {
    if (!mouseDown) return;
    view.offX += e.clientX - lastX;
    view.offY += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    render();
  });
  window.addEventListener('mouseup', () => {
    mouseDown = false;
    scene.classList.remove('dragging');
  });
  scene.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); // 指数缩放更平滑
  }, { passive: false });
  scene.addEventListener('dblclick', reset);

  // ===== 触摸:单指拖动 + 双指捏合缩放/拖动 =====
  let tState = null;
  scene.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      tState = { mode: 'pan', x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else if (e.touches.length === 2) {
      const [a, b] = e.touches;
      tState = { mode: 'pinch', lastDist: dist(a, b), lastMid: mid(a, b) };
    }
  }, { passive: true });

  scene.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!tState) return;
    if (tState.mode === 'pan' && e.touches.length === 1) {
      const t = e.touches[0];
      view.offX += t.clientX - tState.x;
      view.offY += t.clientY - tState.y;
      tState.x = t.clientX; tState.y = t.clientY;
      render();
    } else if (tState.mode === 'pinch' && e.touches.length === 2) {
      const [a, b] = e.touches;
      const d = dist(a, b);
      const m = mid(a, b);
      if (tState.lastDist) {
        zoomAt(tState.lastMid.x, tState.lastMid.y, d / tState.lastDist);
        view.offX += m.x - tState.lastMid.x; // 双指平移:跟随中点
        view.offY += m.y - tState.lastMid.y;
        render();
      }
      tState.lastDist = d;
      tState.lastMid = m;
    }
  }, { passive: false });

  scene.addEventListener('touchend', e => {
    if (e.touches.length === 0) tState = null;
    else if (e.touches.length === 1) {
      // 双指变单指,切换为平移并重置参考点,避免跳变
      tState = { mode: 'pan', x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  });

  // ===== 控制按钮(组件隐藏时元素为 null,判空避免报错)=====
  const on = (id, fn) => {
    const el = document.getElementById(id);
    if (el) el.onclick = fn;
  };
  on('zoomIn', () => zoomAt(innerWidth / 2, innerHeight / 2, 1.2));
  on('zoomOut', () => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.2));
  on('reset', reset);

  // 窗口尺寸变化时重算基础单元,保持图案初始占比
  window.addEventListener('resize', () => {
    setBaseUnit();
    render();
  });
})();
</script>
</body>
</html>
